<!DOCTYPE html>

<html>
    <head>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <main>
            <div class="card">

                <header class="card-header">
                    <h1>INTRODUCTION CARD</h1>
                </header>

                <section class="card-front">
                    <div class="photo-area">
                        <img src="images/profile.JPEG" alt="Photo of Ciana">
                    </div>
                    <div class="info-area">
                        <div class="info-line">
                            <h3>NAME:</h3>
                            <p>Ciana Lee</p>
                        </div>
                        <div class="info-line">
                            <h3>MAJOR:</h3>
                            <p>Computer Science</p>
                        </div>
                        <div class="info-line">
                            <h3>YEAR:</h3>
                            <p>First Year</p>
                        </div>
                        <div class="info-line">
                            <h3>HOMETOWN:</h3>
                            <p>Long Island, New York</p>
                        </div>
                    </div>
                </section>

                <button class="more-button">
                    More Information
                </button>

                <section class="card-back">
                    HERRO
                </section>

            </div>
        </main>
        <script src="script.js"></script>
    </body>
</html>
